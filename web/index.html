<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rumik Agent Platform</title><link rel="stylesheet" href="/docs/docs.css"></head><body><nav><a href="/">Rumik Agent</a><a href="/docs/">Docs</a></nav><main><h1>Give your page a voice and eyes.</h1><p>One platform key hides OpenAI, Rumik, and LiveKit behind a prompt-first browser SDK.</p><form id="signup"><label>Email <input required type="email" name="email"></label> <button>Get API key</button></form><pre id="key" hidden></pre><p class="note">The key is displayed once. Keep it in your server environment, never in browser source.</p><script>document.querySelector('#signup').onsubmit=async e=>{e.preventDefault();const email=new FormData(e.currentTarget).get('email');const r=await fetch('/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});const p=await r.json();const out=document.querySelector('#key');out.hidden=false;out.textContent=r.ok?p.api_key:(p.message||JSON.stringify(p));};</script></main></body></html>
