<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — Rumik Agent</title><link rel="stylesheet" href="/docs/docs.css"></head><body><nav><a href="/">Platform</a><a href="/docs/">Docs</a></nav><main><h1>Developer dashboard</h1><p>This dev-grade dashboard endpoint authenticates with your current platform key. Passwordless account recovery and named key management are next-week work.</p><label>Current key <input id="key" type="password"></label> <button id="load">Load account</button><pre id="output"></pre><script>document.querySelector('#load').onclick=async()=>{const r=await fetch('/account',{headers:{Authorization:'Bearer '+document.querySelector('#key').value}});document.querySelector('#output').textContent=JSON.stringify(await r.json(),null,2);};</script></main></body></html>
